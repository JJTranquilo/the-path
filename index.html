<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Path</title>
<meta name="description" content="A lay practitioner's day, pin potha and library of the Buddha's teachings to householders and kings.">
<meta name="theme-color" content="#120d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Sinhala:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

<section class="view" id="v-today">
  <header class="hero">
    <div class="hero-top">
      <div class="hdate"><b id="t-date">Today</b><span id="t-sub"></span></div>
      <div class="hbtns"><button class="ib light" id="t-tools" aria-label="Tools"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button><button class="ib light" id="t-set" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    </div>
    <div class="hero-mid"><span id="t-badge"></span><h1>The Path</h1></div>
    <div class="dnav"><button id="t-prev" aria-label="Previous day">‹</button><button id="t-home" aria-label="Back to today">Today</button><button id="t-next" aria-label="Next day">›</button></div>
    <div class="now" id="t-now"></div>
  </header>
  <div id="t-banners"></div>
  <div id="t-upo"></div>
  <section class="card hold" id="t-hold"></section>
  <div id="t-refl"></div>
  <div class="sec"><h2>The day</h2><span id="t-count"></span></div>
  <div class="prog" id="t-prog"><i></i></div>
  <div class="list" id="t-list"></div>
  <p class="pad mini foot">Tick a practice and it greys out here and in your Calendar. Times are a guide, except where marked with a gold dot.</p>
</section>

<section class="view" id="v-calendar">
  <header class="top"><h1>Calendar</h1><div class="seg" id="c-seg"><button data-m="week" class="on">Week</button><button data-m="month">Month</button><button data-m="year">Year</button></div></header>
  <div class="sec"><h2 id="c-title"></h2><span class="navs"><button class="ib" id="c-prev" aria-label="Previous">‹</button><button class="ib" id="c-next" aria-label="Next">›</button></span></div>
  <div id="c-body"></div>
</section>

<section class="view" id="v-potha">
  <header class="top"><h1>Pin Potha</h1><div class="seg" id="p-seg"><button data-m="day" class="on">Day</button><button data-m="gallery">Gallery</button><button data-m="search">Search</button></div></header>
  <div id="p-day">
    <div class="sec"><h2 id="p-title"></h2><span class="navs"><button class="ib" id="p-prev" aria-label="Previous day">‹</button><button class="ib" id="p-next" aria-label="Next day">›</button></span></div>
    <div class="pad"><button class="btn" id="p-new">New note</button></div>
    <div class="notes" id="p-notes"></div>
  </div>
  <div id="p-gallery" hidden><div class="gal" id="p-gal"></div></div>
  <div id="p-search" hidden><div class="pad"><input type="search" class="search" id="p-q" placeholder="Search notes, tags, speakers, places"></div><div class="notes" id="p-res"></div></div>
</section>

<section class="view" id="v-rubric">
  <header class="top"><div><h1>The Rubric</h1><p class="si">The walls and moat, built before the enemy comes</p></div><button class="btn sm ghost" id="r-add">Add a skill</button></header>
  <div id="r-body"></div>
</section>

<section class="view" id="v-library"></section>

</div>

<nav class="tabs"><div>
<a href="#today" data-v="today"><svg viewBox="0 0 24 24"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4"/><path d="M6 16a6 6 0 0 1 12 0"/><path d="M3 20h18"/></svg><span>Today</span></a>
<a href="#calendar" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
<a href="#potha" data-v="potha"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6M9 12h5"/></svg><span>Pin Potha</span></a>
<a href="#rubric" data-v="rubric"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l3-2 4 3 4-3 3 2v12"/><path d="M10 21v-5h4v5"/></svg><span>Rubric</span></a>
<a href="#library" data-v="library"><svg viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v17H5.5A1.5 1.5 0 0 0 4 21.5zM20 4.5A1.5 1.5 0 0 0 18.5 3H13v17h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg><span>Library</span></a>
</div></nav>

<div class="sheet" id="sheet"><div class="pn" role="dialog" aria-modal="true" aria-labelledby="s-title"><div class="grab"></div><div class="hdr"><h2 id="s-title"></h2><button class="ib" id="s-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="s-body"></div></div></div>
<div class="viewer" id="viewer"><img id="vw-img" alt=""><div class="vb"><button id="vw-prev" aria-label="Previous photo">‹</button><span id="vw-cap"></span><button id="vw-note">Open note</button><button id="vw-next" aria-label="Next photo">›</button><button id="vw-x" aria-label="Close">✕</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
